localization_monitor:
  ros__parameters:
    # Native monitor uses a 2-message EKF queue and a separate scan-quality worker.
    # Keep the original safety limits; source and monotonic receive ages must both pass.
    # Hold the last trusted correction while local EKF/cloud inputs stay fresh.
    anchor_max_age_sec: 1.0
    ekf_max_age_sec: 0.1
    cloud_max_age_sec: 0.5
    recovery_commits: 3
