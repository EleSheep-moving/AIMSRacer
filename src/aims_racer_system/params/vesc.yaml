/**:
  # general parameters shared by all vesc-related nodes
  ros__parameters:
    # erpm (electrical rpm) = speed_to_erpm_gain * speed (meters / second) + speed_to_erpm_offset
    # 2026-09-27 bag: straight, steady LIO/wheel speed ratio median 1.342.
    # 4650 / 1.342 = 3464.98 ERPM per m/s; confirm with ground distance.
    speed_to_erpm_gain: 3465.0
    speed_to_erpm_offset: 0.0

    # Calibrated from wheelbase=0.36m and minimum turning radius=0.70m:
    # max steering angle = atan(0.36 / 0.70) = 0.475rad.
    # servo value (0 to 1) = gain * steering angle (radians) + offset
    steering_angle_to_servo_gain: -0.5137
    steering_angle_to_servo_offset: 0.506

    port: '/dev/ttyVESC'
    baud_rate: 921600
    telemetry_rate_hz: 100.0
    duty_cycle_min: -1.0
    duty_cycle_max: 1.0
    current_min: -100.0
    current_max: 100.0
    brake_min: 0.0
    brake_max: 0.0
    speed_min: -40000.0
    speed_max: 40000.0
    current_startup_enabled: true
    startup_duty_current: 40.0
    startup_timeout_ms: 100.0
    command_watchdog_enabled: true
    command_timeout_sec: 0.10
    command_max_age_sec: 0.10
    watchdog_safe_erpm: 0.0
    # Verified mechanical steering range. Enforced by the VESC driver.
    servo_min: 0.264
    servo_max: 0.750

vesc_to_odom_node:
  ros__parameters:
    odom_frame: odom
    base_frame: base_link
    # Assumed vx variance in (m/s)^2: sigma=0.2 m/s; tune with real data.
    longitudinal_velocity_variance: 0.04
    # publish odom to base link tf
    publish_tf: false
    use_servo_cmd_to_calc_angular_velocity: true
    # car wheelbase is 36cm
    wheelbase: .36
