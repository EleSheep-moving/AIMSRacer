longitudinal_acceleration:
  ros__parameters:
    wheel_topic: /rear_axle/wheel_odom
    imu_topic: /rear_axle/imu
    output_topic: /state_estimation/longitudinal_acceleration
    status_topic: /state_estimation/longitudinal_acceleration/status
    base_frame_id: base_link
    # Frozen wheel + IMU candidate from the six training / two held-out runs.
    # Effective tuning variances, not independently calibrated sensor noise.
    jerk_psd: 30.0
    disturbance_psd: 0.1
    speed_variance: 0.01
    force_variance: 16.0
    history_seconds: 2.0
    max_history_measurements: 4096
    # Source age diagnostics only; do not gate normal estimates on these ages.
    wheel_warning_age_s: 0.2
    imu_warning_age_s: 0.05
