# base_link: rear-axle midpoint, at the existing base_link height.
# One approximate mounting origin for all external Livox data (livox_frame).
# Ignore the centimetre-scale lidar/IMU separation here. FAST-LIO still uses
# its r_il/t_il internally; do not apply those extrinsics again in rear_axle.
# x is the owner's approximate forward distance; height/rotation are inherited.
livox_translation: [0.30, 0.0, 0.03]
livox_rpy: [0.0, 0.0, 0.0]
