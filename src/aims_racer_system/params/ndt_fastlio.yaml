/**:
  ros__parameters:
    enable_trusted_anchor_protocol: true
    trusted_anchor_max_fitness: 1.5
    trusted_anchor_max_translation_m: 0.5
    trusted_anchor_max_rotation_deg: 10.0
    trusted_anchor_max_source_age_sec: 0.5
    trusted_anchor_initial_confirmations: 3
    registration_method: NDT_OMP
    use_pcd_map: true
    set_initial_pose: false
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    use_odom: false
    use_odom_tf_prediction: true
    enable_map_odom_tf: true
    use_imu: false
    use_imu_preintegration: false
    use_continuous_time_deskew: false
    use_twist_prediction: false
    predict_pose_from_previous_delta: false
    use_twist_ekf: false
    use_gtsam_smoother: false
    cloud_queue_depth: 1
    ndt_num_threads: 2
    ndt_resolution: 1.0
    ndt_step_size: 0.1
    ndt_max_iterations: 35
    transform_epsilon: 0.01
    enable_scan_voxel_filter: true
    voxel_leaf_size: 0.2
    scan_min_range: 0.5
    scan_max_range: 30.0
    scan_period: 0.1
    # Fixed prior-map target: construct NDT cells and warm the PCL search tree
    # during lifecycle configure, before live scans. Online cropping bypasses
    # that warm-up and rebuilds both targets repeatedly on a dense map.
    # See upstream 5f795a6 docs/mid360_legged_jetson.md, "Jetson Defaults".
    enable_local_map_crop: false
    # Visualization only; registration and the map SHA still use the raw PCD.
    viz_downsample: true
    viz_voxel_leaf_size: 0.5
    # Avoid an extra per-scan Hessian pass; independent consistency remains on.
    enable_registration_localizability_diagnostics: false
    reject_above_score_threshold: false
    enable_map_odom_anchor_fitness_gate: false
    enable_seed_correction_guard: false
    enable_rejected_seed_update: false
    enable_consistency_recovery_gate: false
    enable_local_reacquisition: false
    enable_reinitialization_request_output: false
    enable_timer_publishing: true
    pose_publish_frequency: 50.0
    publish_bridge_pose_when_lost: true
    enable_debug: false
