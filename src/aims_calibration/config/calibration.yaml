longitudinal_calibration:
  ros__parameters:
    auto_start: false
    stage: speed_hold
    steering_source: pp
    speeds: [1.0, 2.0, 3.0]
    # REQUIRED explicit signed list for accel_interval or decel_current.
    # This empty default intentionally refuses either current stage.
    currents: []
    start_speed: 1.0
    end_speed: 0.5
    max_speed: 4.0
    max_current: 100.0
    stable_tolerance: 0.2
    stable_seconds: 1.0
    measurement_seconds: 10.0
    hold_sampling: cumulative
    trial_timeout: 8.0
    freshness: 0.2
    repeats: 1
    recovery_speed: 1.0
    rc_profile: steering_ch1_throttle_ch3_aux_ch5_to_ch10
